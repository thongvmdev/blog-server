version: "3.8"
services:
  backend:
    image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    labels:
      - "version=${{ github.sha }}"
    container_name: container-blog-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env

